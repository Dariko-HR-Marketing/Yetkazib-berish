<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Jonli kuzatuv</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B7A4B}a:hover{color:#075C38}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F6F7F4; font-family: Manrope, system-ui, sans-serif; color: #16181B; overflow: hidden">

<div role="img" aria-label="Xarita: filial, kuryer va sizning manzilingiz" style="position: relative; height: 300px; flex: none; background: #E3E8E2; overflow: hidden">
<div style="position: absolute; left: 0; right: 0; top: 112px; height: 16px; background: #F4F5F1"></div>
<div style="position: absolute; left: 0; right: 0; top: 242px; height: 16px; background: #F4F5F1"></div>
<div style="position: absolute; top: 0; bottom: 0; left: 112px; width: 16px; background: #F4F5F1"></div>
<div style="position: absolute; top: 0; bottom: 0; left: 252px; width: 16px; background: #F4F5F1"></div>
<div style="position: absolute; left: 150px; top: 150px; width: 80px; height: 70px; border-radius: 6px; background: #D5DCD3"></div>
<div style="position: absolute; left: 20px; top: 20px; width: 70px; height: 70px; border-radius: 6px; background: #D5DCD3"></div>
<svg width="390" height="300" viewBox="0 0 390 300" aria-hidden="true" style="position: absolute; left: 0; top: 0"><path d="M40 250 L120 250 L120 120 L260 120 L260 60 L300 60" fill="none" stroke="#9AB6E6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path><path d="{{ donePath }}" fill="none" stroke="#1D5FD1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<div style="position: absolute; left: 22px; top: 262px; padding: 4px 8px; border-radius: 8px; background: #16181B; color: #FFFFFF; font-size: 11.5px; font-weight: 700">Filial</div>
<div style="position: absolute; left: 286px; top: 46px; width: 28px; height: 28px; border-radius: 14px; background: #0B7A4B; border: 3px solid #FFFFFF; box-sizing: border-box"></div>
<div style="position: absolute; left: 262px; top: 18px; padding: 4px 8px; border-radius: 8px; background: #FFFFFF; font-size: 11.5px; font-weight: 700">Siz</div>
<div style="{{ courierStyle }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17l4-8h5l3 8"/></svg></div>
<a href="Shop-Tracking.dc.html" aria-label="Orqaga" style="position: absolute; left: 12px; top: 12px; width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 4px rgba(0,0,0,.15)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16181B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
</div>

<div style="flex: 1; display: flex; flex-direction: column; gap: 12px; margin-top: -18px; padding: 16px; border-radius: 20px 20px 0 0; background: #FFFFFF; position: relative">
<div style="display: flex; justify-content: space-between; align-items: flex-start">
<div style="display: flex; flex-direction: column"><span style="font-size: 13px; color: #5E656C">A-104512 · {{ statusSmall }}</span><b style="font-size: 24px; line-height: 30px">{{ headline }}</b></div>
<div style="display: flex; flex-direction: column; align-items: flex-end"><b style="font-size: 24px; color: #154BA8">{{ eta }}</b><span style="font-size: 12.5px; color: #5E656C">{{ dist }}</span></div>
</div>
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: #F6F7F4">
<span style="width: 40px; height: 40px; border-radius: 20px; background: #E5EEF8; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #154BA8">J</span>
<span style="flex: 1; display: flex; flex-direction: column"><b style="font-size: 14px">Jasur · velosiped</b><span style="font-size: 12.5px; color: #5E656C">Joylashuv har 15 soniyada yangilanadi</span></span>
<a href="tel:+998900000000" aria-label="Kuryerga qo'ng'iroq" style="width: 44px; height: 44px; border-radius: 22px; background: #0B7A4B; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></a>
</div>

<ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 0">
<sc-for list="{{ timeline }}" as="t" hint-placeholder-count="7">
<li style="display: flex; gap: 10px; min-height: 34px"><span style="{{ t.dot }}"></span><span style="display: flex; flex-direction: column; flex: 1"><span style="{{ t.textStyle }}">{{ t.title }}</span><span style="font-size: 11.5px; color: #5E656C">{{ t.meta }}</span></span></li>
</sc-for>
</ol>

<div style="flex: 1"></div>
<div style="display: flex; gap: 8px"><button type="button" onClick="{{ prev }}" style="height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid #C9CEC8; background: #FFFFFF; font: 700 13px Manrope, sans-serif">← Oldingi</button><button type="button" onClick="{{ next }}" style="flex: 1; height: 44px; border-radius: 12px; border: none; background: #16181B; color: #FFFFFF; font: 700 13px Manrope, sans-serif">Simulyatsiya: keyingi holat →</button></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { step: 2 };
}
renderVals() {
const s = this.state.step;
const pts = [[40, 250], [120, 250], [120, 120], [260, 120], [260, 60], [300, 60]];
const lens = []; let total = 0;
for (let i = 1; i < pts.length; i++) { const l = Math.abs(pts[i][0] - pts[i - 1][0]) + Math.abs(pts[i][1] - pts[i - 1][1]); lens.push(l); total += l; }
const fr = [0, 0, 0, 0.3, 0.65, 1, 1][s];
let left = fr * total, x = pts[0][0], y = pts[0][1]; const done = ['M40 250'];
for (let i = 1; i < pts.length; i++) {
const l = lens[i - 1];
if (left >= l) { x = pts[i][0]; y = pts[i][1]; done.push('L' + x + ' ' + y); left -= l; }
else { const t = left / l; x = pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * t; y = pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * t; done.push('L' + x.toFixed(1) + ' ' + y.toFixed(1)); break; }
}
const km = 2.1 * (1 - fr);
const heads = ['Yig’ilmoqda', 'Qadoqlandi', 'Kuryer olib ketdi', 'Yo’lda', 'Yo’lda, yaqin', 'Eshik oldida', 'Topshirildi'];
const etas = ['~32 daq', '~22 daq', '~12 daq', '~8 daq', '~4 daq', 'hozir', '14:38'];
const steps = [
['Qabul qilindi', '14:02 · Markaziy filial'],
['Yig’ilmoqda: 3 ta mahsulot', '14:06 · yig’uvchi Dilnoza'],
['Olma ✓ · Non ✓ · Qatiq → muqobil ✓', '14:11 · siz tasdiqladingiz'],
['Qadoqlandi, sumka №12', '14:18 · filial'],
['Kuryerga topshirildi', '14:24 · Jasur, sumka №12 skanerlandi'],
['Yo’lda', 'jonli joylashuv'],
['Yetib keldi', 'Mustaqillik 12, 2-podyezd'],
['Topshirildi · PIN', 'chek havolasi yuborildi']
];
const reached = [2, 4, 5, 5, 6, 7, 8][s];
const timeline = steps.map(([title, meta], i) => {
const done = i < reached, cur = i === reached - 1;
return { title, meta: done ? meta : 'kutilmoqda',
dot: 'flex: none; margin-top: 3px; width: 12px; height: 12px; border-radius: 6px; ' + (cur ? 'background: #1D5FD1; box-shadow: 0 0 0 4px #E5EEF8;' : done ? 'background: #0B7A4B;' : 'background: #FFFFFF; border: 2px solid #C9CEC8; box-sizing: border-box;'),
textStyle: 'font-size: 13px; line-height: 17px; font-weight: ' + (cur ? 800 : done ? 600 : 500) + '; color: ' + (done ? '#16181B' : '#7A8087') + ';' };
});
return {
donePath: done.join(' '),
courierStyle: 'position: absolute; left: ' + (x - 18).toFixed(1) + 'px; top: ' + (y - 18).toFixed(1) + 'px; width: 36px; height: 36px; border-radius: 18px; background: #1D5FD1; border: 3px solid #FFFFFF; box-sizing: border-box; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,.25);' + (s < 2 ? ' opacity: .45;' : ''),
headline: heads[s], statusSmall: s >= 6 ? 'yakunlandi' : 'jonli', eta: etas[s],
dist: s >= 5 ? (s === 6 ? 'topshirildi' : 'yetib keldi') : s < 2 ? 'filialda' : km.toFixed(1).replace('.', ',') + ' km qoldi',
timeline,
next: () => this.setState({ step: Math.min(6, s + 1) }),
prev: () => this.setState({ step: Math.max(0, s - 1) })
};
}
}
</script>
</body>
</html>
