<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Buyurtmani topshirish</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B7A4B}a:hover{color:#075C38}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; padding: 8px 16px 16px; background: #F6F7F4; font-family: Manrope, system-ui, sans-serif; color: #16181B; overflow: hidden">

<div style="display: flex; align-items: center; gap: 4px; margin-left: -12px">
<a href="Courier-Tasks.dc.html" aria-label="Topshiriqlarga qaytish" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16181B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<h1 style="margin: 0; font-size: 18px; font-weight: 800">A-104512 · topshirish</h1>
</div>

<div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E4E7E3">
<span style="font-size: 15px; line-height: 21px"><b>Mustaqillik ko'chasi, 12</b><br>2-podyezd, 4-qavat, 17-xonadon<br><span style="color: #5E656C">Mo'ljal: maktab qarshisi</span></span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<a href="tel:+998901234567" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 46px; border-radius: 12px; border: 1px solid #C9CEC8; color: #16181B; font-weight: 700; font-size: 14px; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16181B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>Qo'ng'iroq</a>
<a href="https://yandex.uz/maps" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 46px; border-radius: 12px; border: 1px solid #C9CEC8; color: #16181B; font-weight: 700; font-size: 14px; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16181B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8z"/></svg>Yo'nalish</a>
</div>
<div style="display: flex; justify-content: space-between; padding: 10px 12px; border-radius: 10px; background: #FDF1E3; color: #7A3E06; font-size: 14px"><span>Naqd olinadi</span><b>48 440 so'm</b></div>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 4px">
<span style="font-size: 14px; font-weight: 700">Xaridordan 4 xonali kodni so'rang</span>
<div style="display: flex; gap: 10px" aria-live="polite">
<sc-for list="{{ boxes }}" as="b" hint-placeholder-count="4">
<div style="{{ b.style }}">{{ b.digit }}</div>
</sc-for>
</div>
<span style="{{ hintStyle }}">{{ hint }}</span>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{ keys }}" as="k" hint-placeholder-count="12">
<button type="button" onClick="{{ k.press }}" aria-label="{{ k.label }}" style="height: 54px; border-radius: 12px; border: 1px solid #DCE0DC; background: #FFFFFF; font: 700 20px Manrope, sans-serif; color: #16181B">{{ k.text }}</button>
</sc-for>
</div>

<div style="flex: 1"></div>
<button type="button" onClick="{{ submit }}" style="{{ submitStyle }}">{{ submitText }}</button>
<a href="Courier-Fail.dc.html" style="display: flex; align-items: center; justify-content: center; height: 44px; color: #9F2D12; font-weight: 700; font-size: 14px; text-decoration: none">Topshirib bo'lmadi — sababini belgilash</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { pin: '', result: null };
}
renderVals() {
const pin = this.state.pin;
const result = this.state.result;
const base = 'width: 56px; height: 64px; box-sizing: border-box; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; background: #FFFFFF;';
const border = result === 'ok' ? 'border: 2px solid #0B7A4B;' : result === 'bad' ? 'border: 2px solid #B4441F;' : 'border: 2px solid #C9CEC8;';
const boxes = [0, 1, 2, 3].map((i) => ({ digit: pin[i] || '', style: base + (i === pin.length && !result ? 'border: 2px solid #16181B;' : border) }));
const press = (d) => () => { if (this.state.result === 'ok') return; if (this.state.pin.length < 4) this.setState({ pin: this.state.pin + d, result: null }); };
const keys = ['1','2','3','4','5','6','7','8','9'].map((d) => ({ text: d, label: d, press: press(d) }));
keys.push({ text: 'C', label: 'Tozalash', press: () => this.setState({ pin: '', result: null }) });
keys.push({ text: '0', label: '0', press: press('0') });
keys.push({ text: '⌫', label: 'O’chirish', press: () => this.setState({ pin: this.state.pin.slice(0, -1), result: null }) });
const ready = pin.length === 4;
let hint = 'Demo kod: 4821';
let hintStyle = 'font-size: 13px; color: #5E656C; min-height: 18px;';
if (result === 'ok') { hint = 'Topshirildi. Xaridor telefoni yashirildi, naqd hisobga yozildi.'; hintStyle = 'font-size: 13px; color: #075C38; font-weight: 700; min-height: 18px; text-align: center;'; }
if (result === 'bad') { hint = 'Kod noto’g’ri. Qayta so’rang.'; hintStyle = 'font-size: 13px; color: #9F2D12; font-weight: 700; min-height: 18px;'; }
const done = result === 'ok';
return {
boxes, keys, hint, hintStyle,
submitText: done ? 'Topshirildi ✓' : 'Topshirildi deb belgilash',
submitStyle: 'height: 56px; border-radius: 14px; border: none; font: 700 16px Manrope, sans-serif; color: #FFFFFF; background: ' + (done ? '#075C38' : ready ? '#0B7A4B' : '#9AA19C') + ';',
submit: () => { if (this.state.pin.length === 4) this.setState({ result: this.state.pin === '4821' ? 'ok' : 'bad' }); }
};
}
}
</script>
</body>
</html>
