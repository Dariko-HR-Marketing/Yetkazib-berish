<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Topshirib bo'lmadi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B7A4B}a:hover{color:#075C38}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F6F7F4; font-family: Manrope, system-ui, sans-serif; color: #16181B">

<div aria-hidden="true" style="display: flex; flex-direction: column; gap: 12px; padding: 16px">
<div style="height: 28px; width: 220px; border-radius: 8px; background: #E4E7E3"></div>
<div style="height: 150px; border-radius: 16px; background: #FFFFFF"></div>
<div style="height: 64px; width: 260px; align-self: center; border-radius: 14px; background: #FFFFFF"></div>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(22,24,27,.55)"></div>

<div role="dialog" aria-modal="true" aria-labelledby="fail-title" style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 14px; padding: 12px 16px 20px; border-radius: 22px 22px 0 0; background: #FFFFFF">
<div style="align-self: center; width: 44px; height: 5px; border-radius: 3px; background: #DCE0DC"></div>
<div style="display: flex; flex-direction: column; gap: 4px"><h2 id="fail-title" style="margin: 0; font-size: 20px; font-weight: 800">Topshirib bo'lmadi</h2><span style="font-size: 13.5px; color: #5E656C">A-104512 · sabab dispetcher va yordam xizmatiga boradi</span></div>

<div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 12px; background: #FDF1E3; color: #7A3E06; font-size: 13.5px"><span>Bog'lanish urinishlari: <b>{{ attemptsText }}</b></span><button type="button" onClick="{{ call }}" style="height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid #F1C995; background: #FFFFFF; font: 700 13px Manrope, sans-serif; color: #7A3E06">Qo'ng'iroq qilish</button></div>

<fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 8px">
<legend style="font-size: 14px; font-weight: 700; padding-bottom: 8px">Sabab</legend>
<sc-for list="{{ reasons }}" as="r" hint-placeholder-count="5">
<button type="button" onClick="{{ r.pick }}" aria-pressed="{{ r.pressed }}" style="{{ r.style }}">{{ r.label }}</button>
</sc-for>
</fieldset>

<span style="font-size: 12.5px; line-height: 18px; color: #5E656C">Kamida 2 urinish va 10 daqiqa kutish qayd etilgach, «Javob bermadi» sababi ochiladi.</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<a href="Courier-Deliver.dc.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 14px; border: 1px solid #C9CEC8; color: #16181B; font-weight: 700; font-size: 15px; text-decoration: none">Orqaga</a>
<button type="button" style="{{ submitStyle }}">Yuborish</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { reason: null, attempts: 1 };
}
renderVals() {
const list = [['no_answer', 'Javob bermadi, eshikni ochmadi'], ['wrong_address', 'Manzil noto’g’ri yoki topilmadi'], ['refused', 'Xaridor qabul qilmadi'], ['damaged', 'Yo’lda shikastlandi'], ['other', 'Boshqa sabab']];
const enoughAttempts = this.state.attempts >= 2;
const reasons = list.map(([id, label]) => {
const locked = id === 'no_answer' && !enoughAttempts;
const on = this.state.reason === id;
return {
label: locked ? label + ' — yana 1 urinish kerak' : label,
pressed: on ? 'true' : 'false',
style: 'min-height: 48px; padding: 0 14px; border-radius: 12px; text-align: left; font: 600 14px Manrope, sans-serif; ' + (on ? 'border: 2px solid #9F2D12; background: #FBE9E4; color: #16181B;' : locked ? 'border: 1px solid #E4E7E3; background: #F6F7F4; color: #5E656C;' : 'border: 1px solid #DCE0DC; background: #FFFFFF; color: #16181B;'),
pick: () => { if (!locked) this.setState({ reason: id }); }
};
});
const ready = this.state.reason !== null;
return {
reasons,
attemptsText: this.state.attempts + ' / 2',
call: () => this.setState({ attempts: Math.min(this.state.attempts + 1, 3) }),
submitStyle: 'height: 54px; border-radius: 14px; border: none; font: 700 15px Manrope, sans-serif; color: #FFFFFF; background: ' + (ready ? '#9F2D12' : '#8A9199') + ';'
};
}
}
</script>
</body>
</html>
