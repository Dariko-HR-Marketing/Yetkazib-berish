<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Kuryer: ishga qabul va roziliklar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0} button{font-family:Manrope,system-ui,sans-serif}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #16181B; font-family: Manrope, system-ui, sans-serif; color: #FFFFFF; overflow: hidden">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 20px 16px 12px">
<b style="font-size: 18px">Kuryer sifatida ishga kirish</b>
<span style="font-size: 12.5px; color: #C9CED3">Yashil Savat · 4 qadam · taxminan 10 daqiqa</span>
<div style="display: flex; gap: 4px"><sc-for list="{{ bar }}" as="b" hint-placeholder-count="4"><span style="{{ b.style }}"></span></sc-for></div>
</div>
<div style="flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 10px; padding: 6px 16px 16px">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 16px; background: #2A2D31">
<b style="font-size: 14.5px">1. Maqomingiz</b>
<div style="display: flex; flex-direction: column; gap: 6px"><sc-for list="{{ status }}" as="s" hint-placeholder-count="3"><button type="button" onClick="{{ s.pick }}" aria-pressed="{{ s.pressed }}" style="{{ s.style }}"><b style="font-size: 13.5px">{{ s.t }}</b><span style="font-size: 11.5px; opacity: .8">{{ s.d }}</span></button></sc-for></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 16px; background: #2A2D31">
<b style="font-size: 14.5px">2. Hujjatlar</b>
<sc-for list="{{ docs }}" as="d" hint-placeholder-count="4"><button type="button" onClick="{{ d.pick }}" style="display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: 10px; border: 1px solid #3C4248; background: #16181B; color: #FFFFFF; cursor: pointer; text-align: left"><span style="display: flex; flex-direction: column"><b style="font-size: 13px">{{ d.t }}</b><span style="font-size: 11px; color: #9AA1A7">{{ d.d }}</span></span><span style="{{ d.st }}">{{ d.s }}</span></button></sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 16px; background: #2A2D31">
<b style="font-size: 14.5px">3. Shartnoma va roziliklar</b>
<sc-for list="{{ consents }}" as="c" hint-placeholder-count="4"><button type="button" role="checkbox" aria-checked="{{ c.on }}" onClick="{{ c.toggle }}" style="display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border: none; background: transparent; color: #FFFFFF; cursor: pointer; text-align: left"><span style="{{ c.box }}">{{ c.mark }}</span><span style="display: flex; flex-direction: column; gap: 2px"><b style="font-size: 13px">{{ c.t }}</b><span style="font-size: 11.5px; line-height: 15px; color: #9AA1A7">{{ c.d }}</span></span></button></sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 16px; background: #2A2D31">
<b style="font-size: 14.5px">4. Majburiy o'quv modullari</b>
<sc-for list="{{ modules }}" as="m" hint-placeholder-count="5"><div style="display: flex; justify-content: space-between; font-size: 12.5px; padding: 3px 0"><span>{{ m.t }}</span><span style="color: {{ m.c }}; font-weight: 700">{{ m.s }}</span></div></sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 16px 18px; border-top: 1px solid #3C4248">
<button type="button" onClick="{{ sign }}" aria-disabled="{{ cantSign }}" style="{{ signStyle }}">{{ signLabel }}</button>
<span style="font-size: 11px; color: #9AA1A7; text-align: center">{{ signNote }}</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { status: 0, docs: [true, true, false, true], cons: [true, true, false, false], signed: false };
}
renderVals() {
const st = this.state;
const S = [['O’zini o’zi band qilgan', 'Soliqni o’zingiz to’laysiz; yillik daromad 100 mln so’mdan oshsa, do’kon soliq agenti'], ['Yakka tartibdagi tadbirkor', 'Shartnoma YaTT sifatida, hisob-faktura bilan'], ['Do’kon xodimi', 'Mehnat shartnomasi, ish haqi do’kondan']];
const status = S.map((s, i) => ({ t: s[0], d: s[1], pressed: st.status === i ? 'true' : 'false', pick: () => this.setState({ status: i }),
style: 'display: flex; flex-direction: column; gap: 2px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; cursor: pointer; text-align: left; color: #FFFFFF; ' + (st.status === i ? 'border: 2px solid #0B7A4B; background: rgba(11,122,75,.18);' : 'border: 1px solid #3C4248; background: #16181B;') }));
const D = [['Pasport yoki ID-karta', 'JShShIR bilan · faqat shartnoma va soliq uchun'], [st.status === 0 ? 'O’zini o’zi band qilganlik guvohnomasi' : st.status === 1 ? 'YaTT guvohnomasi' : 'Mehnat daftarchasi (elektron)', 'my.soliq.uz yoki Davlat xizmatlari'], ['Haydovchilik guvohnomasi va transport', 'velosiped / skuter / avtomobil'], ['Profil surati', 'Faqat ko’rsatish uchun; yuzni tanish ishlatilmaydi']];
const docs = D.map((d, i) => { const on = st.docs[i];
return { t: d[0], d: d[1], s: on ? 'Yuklandi ✓' : 'Yuklash', st: 'flex: none; padding: 4px 9px; border-radius: 7px; font-size: 11.5px; font-weight: 800; ' + (on ? 'background: #0B7A4B; color: #FFFFFF;' : 'background: #F1B53C; color: #16181B;'),
pick: () => { const a = st.docs.slice(); a[i] = true; this.setState({ docs: a }); } }; });
const C = [['Kuryerlik xizmati shartnomasi (v1.0)', 'Stavka, haftalik to’lov, naqd va chek, 1,5 mln naqd limiti, javobgarlik'], ['Kuryer ilovasi qoidalari (v1.0)', 'Hisobni boshqaga bermaslik, GPS soxtalashtirish taqiqi'], ['Geolokatsiya — faqat smena vaqtida', 'Smena tugagach GPS o’chadi; xaridor faqat o’z buyurtmasida ko’radi'], ['Mijoz ma’lumotini oshkor qilmaslik', 'Manzil va telefon topshirilgach yashiriladi; qadoqni ochmaslik']];
const consents = C.map((c, i) => { const on = st.cons[i];
return { t: c[0], d: c[1], on: on ? 'true' : 'false', mark: on ? '✓' : '',
box: 'flex: none; width: 22px; height: 22px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; ' + (on ? 'background: #0B7A4B;' : 'border: 2px solid #5E656C; box-sizing: border-box;'),
toggle: () => { const a = st.cons.slice(); a[i] = !a[i]; this.setState({ cons: a, signed: false }); } }; });
const modules = [['Ilova va navigatsiya · 10 daq', 'O’tildi ✓', '#8FD3B0'], ['PIN, naqd va QR to’lov · 8 daq', 'O’tildi ✓', '#8FD3B0'], ['Yo’l xavfsizligi · 15 daq', 'Boshlash', '#F1B53C'], ['Sanitariya va termosumka · 6 daq', 'Boshlash', '#F1B53C'], ['Muomala madaniyati · 9 daq', 'Boshlash', '#F1B53C']].map((m) => ({ t: m[0], s: m[1], c: m[2] }));
const ready = st.docs.every((x) => x) && st.cons.every((x) => x);
const done = [true, st.docs.every((x) => x), st.cons.every((x) => x), false];
const bar = done.map((d) => ({ style: 'flex: 1; height: 4px; border-radius: 2px; background: ' + (d ? '#0B7A4B' : '#3C4248') + ';' }));
return { status, docs, consents, modules, bar, cantSign: ready && !st.signed ? 'false' : 'true',
signLabel: st.signed ? 'Imzolandi ✓ · do’kon tasdig’i kutilmoqda' : 'SMS kod bilan imzolash',
signStyle: 'height: 52px; border-radius: 14px; border: none; font-size: 15px; font-weight: 800; cursor: pointer; ' + (st.signed ? 'background: #E6F2EC; color: #075C38;' : ready ? 'background: #0B7A4B; color: #FFFFFF;' : 'background: #3C4248; color: #9AA1A7;'),
signNote: st.signed ? 'Birinchi smenadan oldin qolgan 3 ta modulni o’ting' : 'E-IMZO kaliti bo’lsa, u bilan ham imzolash mumkin',
sign: () => { if (ready) this.setState({ signed: true }); } };
}
}
</script>
</body>
</html>
