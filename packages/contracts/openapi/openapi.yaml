      responses:
        '200': { description: Hisobot, content: { application/json: { schema: { $ref: '#/components/schemas/SalesReport' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/audit:
    get:
      tags: [insights]
      operationId: auditLog
