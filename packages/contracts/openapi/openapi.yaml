        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/shops/{slug}/loyalty:
    get:
      tags: [storefront]
      operationId: myLoyalty
      summary: Xaridorning shu do'kondagi ball balansi
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Ball, content: { application/json: { schema: { $ref: '#/components/schemas/LoyaltySummary' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/delivery/settings:
    get:
      tags: [orders]
      operationId: getDeliverySettings
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      responses:
        '200': { description: Yetkazish sozlamalari, content: { application/json: { schema: { $ref: '#/components/schemas/DeliverySettings' } } } }
