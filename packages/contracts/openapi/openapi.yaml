openapi: 3.1.0
info:
  title: Dostavka SaaS — S0 API (identity, tenancy, plans-flags)
  version: 0.1.0
  description: |
    S0 sprint shartnomasi. Manba: docs/01_prd/03_S0_spetsifikatsiya_va_hodisalar.md.
    Umumiy qoidalar:
    - Xato formati: `{code, message_uz, message_ru, details}`.
    - Do'konga tegishli so'rovlarda `X-Tenant-Id` majburiy; foydalanuvchi a'zo bo'lmagan do'kon uchun 404 qaytadi (403 emas).
    - Holatni o'zgartiruvchi so'rovlar (auth'dan tashqari) `Idempotency-Key` (UUID) talab qiladi.
    - Summalar butun son (tiyin); vaqt ISO-8601 UTC.
    - Ro'yxatlar kursor bilan sahifalanadi: `?limit=&cursor=`.
servers:
  - url: /
tags:
  - { name: system }
  - { name: auth }
  - { name: tenancy }
  - { name: features }
  - { name: admin }
  - { name: legal }
security:
  - bearer: []
paths:
  /v1/health:
    get:
      tags: [system]
      operationId: getHealth
      security: []
      summary: Tirikligi tekshiruvi (baza va Redis)
      responses:
        '200': { description: Ishlayapti, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, const: ok } } } } } }
        '503': { $ref: '#/components/responses/Error' }
  /v1/auth/otp/request:
    post:
      tags: [auth]
      operationId: requestOtp
      security: []
      summary: SMS kod so'rash (I-1)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OtpRequest' } } } }
      responses:
        '202': { description: Kod yuborildi, content: { application/json: { schema: { $ref: '#/components/schemas/OtpRequested' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '423': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/auth/otp/verify:
    post:
      tags: [auth]
      operationId: verifyOtp
      security: []
      summary: Kodni tekshirish (I-2, I-4, I-5)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OtpVerify' } } } }
      responses:
        '200': { $ref: '#/components/responses/SignIn' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '423': { $ref: '#/components/responses/Error' }
  /v1/auth/telegram:
    post:
      tags: [auth]
      operationId: signInTelegram
      security: []
      summary: Telegram mini-ilova initData (I-3)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TelegramSignIn' } } } }
      responses:
        '200': { $ref: '#/components/responses/SignIn' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      security: []
      summary: Yangilash tokeni aylanishi (I-6)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RefreshRequest' } } } }
      responses:
        '200': { description: Yangi tokenlar, content: { application/json: { schema: { $ref: '#/components/schemas/Tokens' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sessiyani tugatish
      responses:
        '204': { description: Tugatildi }
        '401': { $ref: '#/components/responses/Error' }
  /v1/auth/totp/enroll:
    post:
      tags: [auth]
      operationId: enrollTotp
      summary: TOTP kalitini yaratish (I-5)
      responses:
        '200': { description: Kalit, content: { application/json: { schema: { $ref: '#/components/schemas/TotpEnrollment' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /v1/auth/totp/confirm:
    post:
      tags: [auth]
      operationId: confirmTotp
      summary: TOTP ni yoqish (birinchi kod bilan)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TotpCode' } } } }
      responses:
        '200': { description: Ikkinchi omilli tokenlar, content: { application/json: { schema: { $ref: '#/components/schemas/Tokens' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/auth/totp/verify:
    post:
      tags: [auth]
      operationId: verifyTotp
      security: []
      summary: Kirishda ikkinchi omil (I-5)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TotpVerify' } } } }
      responses:
        '200': { description: Tokenlar, content: { application/json: { schema: { $ref: '#/components/schemas/Tokens' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /v1/me:
    get:
      tags: [auth]
      operationId: getMe
      responses:
        '200': { description: Joriy foydalanuvchi, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /v1/me/consents:
    get:
      tags: [auth]
      operationId: listMyConsents
      summary: Har hujjat bo'yicha oxirgi rozilik holati
      responses:
        '200': { description: Rozilik holatlari, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/ConsentState' } } } } } } }
        '401': { $ref: '#/components/responses/Error' }
  /v1/me/consents/marketing:
    put:
      tags: [auth]
      operationId: setMarketingConsent
      summary: Marketing roziligini berish yoki qaytarib olish (xizmat roziligidan alohida)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [granted], additionalProperties: false, properties: { granted: { type: boolean } } } } } }
      responses:
        '200': { description: Holat, content: { application/json: { schema: { type: object, required: [document, granted], properties: { document: { type: string, const: marketing }, granted: { type: boolean } } } } } }
        '401': { $ref: '#/components/responses/Error' }
  /v1/legal/documents:
    get:
      tags: [legal]
      operationId: listLegalDocuments
      security: []
      summary: Akcept qilinadigan joriy hujjat versiyalari (ommaviy)
      parameters:
        - { name: audience, in: query, schema: { type: string, enum: [customer, shop, courier] } }
        - { name: Accept-Language, in: header, schema: { type: string, enum: [uz, ru] } }
      responses:
        '200': { description: Hujjatlar, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/LegalDocumentView' } } } } } } }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/legal/documents/{key}:
    get:
      tags: [legal]
      operationId: getLegalDocument
      security: []
      summary: Hujjat matni (markdown). `version` berilmasa — joriy versiya
      parameters:
        - { name: key, in: path, required: true, schema: { $ref: '#/components/schemas/LegalKey' } }
        - { name: version, in: query, schema: { type: integer, minimum: 1 } }
        - { name: Accept-Language, in: header, schema: { type: string, enum: [uz, ru] } }
      responses:
        '200': { description: Hujjat, content: { application/json: { schema: { $ref: '#/components/schemas/LegalDocument' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /v1/admin/legal:
    get:
      tags: [admin]
      operationId: adminListLegal
      responses:
        '200': { description: Barcha versiyalar (matnsiz), content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/LegalAdminItem' } } } } } } }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [admin]
      operationId: adminCreateLegalDraft
      summary: Hujjatning yangi (qoralama) versiyasi
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LegalDraftInput' } } } }
      responses:
        '201': { description: Yaratildi, content: { application/json: { schema: { $ref: '#/components/schemas/LegalAdminItem' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/admin/legal/{id}/publish:
    post:
      tags: [admin]
      operationId: adminPublishLegal
      summary: Kuchga kiritish (to'ldirilmagan joylar qolsa 422 legal.placeholders_remain)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: false, content: { application/json: { schema: { type: object, additionalProperties: false, properties: { effective_from: { type: string, format: date-time } } } } } }
      responses:
        '200': { description: Kuchga kirdi, content: { application/json: { schema: { $ref: '#/components/schemas/LegalPublished' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/tenants:
    post:
      tags: [tenancy]
      operationId: createTenant
      summary: Do'kon yaratish (T-1, T-2)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TenantCreate' } } } }
      responses:
        '201': { description: Yaratildi, content: { application/json: { schema: { $ref: '#/components/schemas/Tenant' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/tenants/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [tenancy]
      operationId: getTenant
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      responses:
        '200': { description: Do'kon, content: { application/json: { schema: { $ref: '#/components/schemas/Tenant' } } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [tenancy]
      operationId: updateTenant
      parameters: [{ $ref: '#/components/parameters/TenantId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TenantUpdate' } } } }
      responses:
        '200': { description: Yangilandi, content: { application/json: { schema: { $ref: '#/components/schemas/Tenant' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/branches:
    get:
      tags: [tenancy]
      operationId: listBranches
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      responses:
        '200': { description: Filiallar, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Branch' } } } } } } }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [tenancy]
      operationId: createBranch
      parameters: [{ $ref: '#/components/parameters/TenantId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BranchCreate' } } } }
      responses:
        '201': { description: Yaratildi, content: { application/json: { schema: { $ref: '#/components/schemas/Branch' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/invites:
    get:
      tags: [tenancy]
      operationId: listInvites
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      responses:
        '200': { description: Kutilayotgan takliflar, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Invite' } } } } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [tenancy]
      operationId: createInvite
      summary: Xodim taklif qilish (T-3, T-5)
      parameters: [{ $ref: '#/components/parameters/TenantId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InviteCreate' } } } }
      responses:
        '201': { description: Yuborildi, content: { application/json: { schema: { $ref: '#/components/schemas/Invite' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/invites/{token}/accept:
    post:
      tags: [tenancy]
      operationId: acceptInvite
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: Qabul qilindi, content: { application/json: { schema: { $ref: '#/components/schemas/Member' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
  /v1/members:
    get:
      tags: [tenancy]
      operationId: listMembers
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200': { description: Xodimlar, content: { application/json: { schema: { $ref: '#/components/schemas/MemberList' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/members/{id}:
    patch:
      tags: [tenancy]
      operationId: updateMember
      summary: Rol yoki holatni o'zgartirish (T-6)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MemberUpdate' } } } }
      responses:
        '200': { description: Yangilandi, content: { application/json: { schema: { $ref: '#/components/schemas/Member' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/features:
    get:
      tags: [features]
      operationId: listFeatures
      summary: Do'kon uchun hisoblangan funksiyalar (F-1…F-3)
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      responses:
        '200': { description: Funksiyalar, content: { application/json: { schema: { $ref: '#/components/schemas/FeatureList' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /v1/features/{key}:
    patch:
      tags: [features]
      operationId: toggleFeature
      summary: Funksiyani yoqish/o'chirish (F-2, F-3, F-5, F-6)
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [enabled], additionalProperties: false, properties: { enabled: { type: boolean } } } } } }
      responses:
        '200': { description: Yangilandi, content: { application/json: { schema: { $ref: '#/components/schemas/Feature' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/admin/plans:
    get:
      tags: [admin]
      operationId: adminListPlans
      responses:
        '200': { description: Paket versiyalari, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Plan' } } } } } } }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [admin]
      operationId: adminCreatePlan
      summary: Paketning yangi (qoralama) versiyasi
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PlanDraft' } } } }
      responses:
        '201': { description: Yaratildi, content: { application/json: { schema: { $ref: '#/components/schemas/Plan' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/admin/plans/{id}/publish:
    post:
      tags: [admin]
      operationId: adminPublishPlan
      summary: Versiyani chop etish (F-4)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: Chop etildi, content: { application/json: { schema: { $ref: '#/components/schemas/Plan' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/admin/flags:
    get:
      tags: [admin]
      operationId: adminListFlags
      responses:
        '200': { description: Platforma kalitlari, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/PlatformFlag' } } } } } } }
        '403': { $ref: '#/components/responses/Error' }
  /v1/admin/flags/{key}:
    patch:
      tags: [admin]
      operationId: adminSetFlag
      summary: Avariya o'chirgichi (F-1)
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [platform_enabled], additionalProperties: false, properties: { platform_enabled: { type: boolean } } } } } }
      responses:
        '200': { description: Yangilandi, content: { application/json: { schema: { $ref: '#/components/schemas/PlatformFlag' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/admin/tenants/{id}/plan:
    post:
      tags: [admin]
      operationId: adminSetTenantPlan
      summary: Do'kon paketini o'zgartirish (billing S7 gacha qo'lda)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [plan_code], additionalProperties: false, properties: { plan_code: { $ref: '#/components/schemas/PlanCode' } } } } } }
      responses:
        '200': { description: O'zgartirildi, content: { application/json: { schema: { $ref: '#/components/schemas/Tenant' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    TenantId: { name: X-Tenant-Id, in: header, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
  responses:
    Error: { description: Xato, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    SignIn:
      description: Kirish natijasi (tokenlar yoki ikkinchi omil talabi)
      content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/SignInResult' }, { $ref: '#/components/schemas/MfaChallenge' }] } } }
  schemas:
    Error:
      type: object
      required: [code, message_uz, message_ru, details]
      additionalProperties: false
      properties:
        code: { type: string, examples: ['validation.tin_invalid'] }
        message_uz: { type: string }
        message_ru: { type: string }
        details: { type: object, additionalProperties: true }
    LegalKey: { type: string, enum: [customer_offer, privacy_policy, shop_saas_offer, shop_dpa, courier_agreement] }
    ConsentState:
      type: object
      required: [document, version, action, at]
      properties: { document: { type: string }, version: { type: string }, action: { type: string, enum: [accepted, revoked] }, at: { type: string, format: date-time } }
    LegalDocumentView:
      type: object
      required: [key, title, version, locale, translated, status, effective_from, text_hash]
      properties:
        key: { $ref: '#/components/schemas/LegalKey' }
        title: { type: string }
        version: { type: string }
        locale: { type: string, enum: [uz, ru] }
        translated: { type: boolean, description: "false: so'ralgan tilda tarjima yo'q, o'zbekcha ko'rsatilmoqda" }
        status: { type: string, enum: [draft, effective, retired], description: "draft — yurist tasdiqlamagan (faqat staging/dev)" }
        effective_from: { type: [string, 'null'], format: date-time }
        text_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
    LegalDocument:
      allOf:
        - { $ref: '#/components/schemas/LegalDocumentView' }
        - { type: object, required: [body_md], properties: { body_md: { type: string } } }
    LegalAdminItem:
      type: object
      required: [id, key, locale, version, title, audience, status, text_hash]
      properties:
        id: { type: string, format: uuid }
        key: { $ref: '#/components/schemas/LegalKey' }
        locale: { type: string, enum: [uz, ru] }
        version: { type: string }
        title: { type: string }
        audience: { type: string, enum: [customer, shop, courier] }
        status: { type: string, enum: [draft, effective, retired] }
        effective_from: { type: [string, 'null'], format: date-time }
        text_hash: { type: string }
        placeholders: { type: array, items: { type: string }, description: "To'ldirilmagan joylar (draft yaratilganda)" }
    LegalDraftInput:
      type: object
      required: [key, locale, title, body_md]
      additionalProperties: false
      properties:
        key: { $ref: '#/components/schemas/LegalKey' }
        locale: { type: string, enum: [uz, ru] }
        title: { type: string, minLength: 3, maxLength: 200 }
        body_md: { type: string, minLength: 200 }
    LegalPublished:
      type: object
      required: [id, key, locale, version, status, effective_from, text_hash]
      properties:
        id: { type: string, format: uuid }
        key: { $ref: '#/components/schemas/LegalKey' }
        locale: { type: string }
        version: { type: string }
