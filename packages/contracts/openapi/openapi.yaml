      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeliverySettings' } } } }
      responses:
        '200': { description: Saqlandi, content: { application/json: { schema: { $ref: '#/components/schemas/DeliverySettings' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/reports/sales:
    get:
