      parameters: [{ $ref: '#/components/parameters/TenantId' }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }, { name: cursor, in: query, schema: { type: string } }, { name: action, in: query, schema: { type: string, maxLength: 60 } }]
      responses:
        '200': { description: Jurnal, content: { application/json: { schema: { $ref: '#/components/schemas/AuditPage' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/customers:
    get:
      tags: [insights]
      operationId: customers360
      summary: "Mijoz 360 (maskalangan, faqat ichki tahlil)"
      parameters: [{ $ref: '#/components/parameters/TenantId' }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }]
      responses:
        '200': { description: Mijozlar, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerList' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/admin/tenants:
    get:
      tags: [admin]
      operationId: adminListTenants
      parameters: [{ name: q, in: query, schema: { type: string } }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }]
      responses:
        '200': { description: Do'konlar, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/AdminTenant' } } } } } } }
        '403': { $ref: '#/components/responses/Error' }
  /v1/marketplace/shops:
    get:
      tags: [storefront]
      operationId: marketplaceShops
      security: []
      summary: "Umumiy katalog («Yaqin do'konlar»): catalog.marketplace_listing yoqilgan faol do'konlar"
      responses:
        '200': { description: Do'konlar, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { type: object, required: [name, slug], properties: { name: { type: string }, slug: { type: string } } } } } } } } }
  /v1/webhooks/{provider}/{slug}:
    post:
      tags: [payments]
      operationId: paymentWebhook
      security: []
      summary: "To'lov provayderi callback'i. Imzo (mock: x-signature = HMAC-SHA256(raw tana, kalit)); (provider, event_id) bo'yicha takror xavfsiz"
      parameters: [{ name: provider, in: path, required: true, schema: { type: string, enum: [mock, payme, click, uzum] } }, { name: slug, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentWebhook' } } } }
      responses:
        '200': { description: Qabul qilindi (takror bo'lsa duplicate=true), content: { application/json: { schema: { type: object, required: [ok], properties: { ok: { type: boolean }, duplicate: { type: boolean }, ignored: { type: string }, refunded: { type: boolean } } } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/shops/{slug}/payments/{id}/sandbox:
    post:
      tags: [payments]
      operationId: paymentSandbox
      summary: Sinov to'lovi (faqat mock provayder, productionda SANDBOX_PAYMENTS=on bo'lmasa 404)
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [outcome], additionalProperties: false, properties: { outcome: { type: string, enum: [captured, failed] } } } } } }
      responses:
        '200': { description: Natija, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/payments/settings:
    get:
      tags: [payments]
      operationId: getPaymentSettings
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      responses:
        '200': { description: Sozlamalar (kalit qaytmaydi), content: { application/json: { schema: { $ref: '#/components/schemas/PaymentSettings' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [payments]
      operationId: setPaymentSettings
      parameters: [{ $ref: '#/components/parameters/TenantId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentSettingsInput' } } } }
      responses:
        '200': { description: Saqlandi, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentSettings' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/orders/{id}/refund:
    post:
      tags: [payments]
      operationId: refundOrder
      summary: Qisman yoki to'liq qaytarish (summa bo'sh = qolgani). Moliya ruxsati
      parameters: [{ $ref: '#/components/parameters/TenantId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], additionalProperties: false, properties: { amount_tiyin: { type: integer, minimum: 1 }, reason: { type: string, minLength: 2, maxLength: 60 } } } } } }
      responses:
        '200': { description: Qaytarildi, content: { application/json: { schema: { $ref: '#/components/schemas/Payment' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/cash/couriers:
    get:
      tags: [payments]
      operationId: cashCouriers
      summary: "Kuryerlardagi naqd (yetkazilgan − topshirilgan) va chegara"
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      responses:
        '200': { description: Kuryerlar naqdi, content: { application/json: { schema: { $ref: '#/components/schemas/CashCouriers' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/cash/handover:
    post:
      tags: [payments]
      operationId: cashHandover
      summary: "Kuryer naqdini kassaga topshirish (o'zgarmas yozuv; mavjud naqddan oshmaydi)"
      parameters: [{ $ref: '#/components/parameters/TenantId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [courier_user_id, amount_tiyin], additionalProperties: false, properties: { courier_user_id: { type: string, format: uuid }, amount_tiyin: { type: integer, minimum: 1 }, note: { type: string, maxLength: 200 } } } } } }
      responses:
        '200': { description: Qayd etildi, content: { application/json: { schema: { type: object, required: [id, on_hand_tiyin], properties: { id: { type: integer }, on_hand_tiyin: { type: integer } } } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    TenantId: { name: X-Tenant-Id, in: header, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
  responses:
    Error: { description: Xato, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    SignIn:
      description: Kirish natijasi (tokenlar yoki ikkinchi omil talabi)
      content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/SignInResult' }, { $ref: '#/components/schemas/MfaChallenge' }] } } }
  schemas:
    AuditPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, created_at, action, entity, entity_id, actor, before, after]
            properties:
              id: { type: integer }
              created_at: { type: string, format: date-time }
              action: { type: string }
              entity: { type: string }
              entity_id: { type: string }
              actor: { type: [object, 'null'], required: [id, phone_masked], properties: { id: { type: string, format: uuid }, phone_masked: { type: [string, 'null'] } } }
              before: { type: [object, 'null'] }
              after: { type: [object, 'null'] }
        next_cursor: { type: [string, 'null'] }
    CustomerList:
      type: object
      required: [total_customers, items]
      properties:
        total_customers: { type: integer }
        items:
          type: array
          items:
            type: object
            required: [customer_id, phone_masked, orders, completed, cancelled, spent_tiyin, last_order_at, points_balance, repeat]
            properties:
              customer_id: { type: string, format: uuid }
              phone_masked: { type: [string, 'null'] }
              orders: { type: integer }
              completed: { type: integer }
              cancelled: { type: integer }
              spent_tiyin: { type: integer }
              last_order_at: { type: string, format: date-time }
              points_balance: { type: integer }
              repeat: { type: boolean }
    Error:
      type: object
      required: [code, message_uz, message_ru, details]
      additionalProperties: false
      properties:
        code: { type: string, examples: ['validation.tin_invalid'] }
        message_uz: { type: string }
        message_ru: { type: string }
        details: { type: object, additionalProperties: true }
    LegalKey: { type: string, enum: [customer_offer, privacy_policy, shop_saas_offer, shop_dpa, courier_agreement] }
    ConsentState:
      type: object
      required: [document, version, action, at]
      properties: { document: { type: string }, version: { type: string }, action: { type: string, enum: [accepted, revoked] }, at: { type: string, format: date-time } }
    LegalDocumentView:
      type: object
      required: [key, title, version, locale, translated, status, effective_from, text_hash]
      properties:
        key: { $ref: '#/components/schemas/LegalKey' }
        title: { type: string }
        version: { type: string }
        locale: { type: string, enum: [uz, ru] }
        translated: { type: boolean, description: "false: so'ralgan tilda tarjima yo'q, o'zbekcha ko'rsatilmoqda" }
        status: { type: string, enum: [draft, effective, retired], description: "draft — yurist tasdiqlamagan (faqat staging/dev)" }
        effective_from: { type: [string, 'null'], format: date-time }
        text_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
    LegalDocument:
      allOf:
        - { $ref: '#/components/schemas/LegalDocumentView' }
        - { type: object, required: [body_md], properties: { body_md: { type: string } } }
    LegalAdminItem:
      type: object
      required: [id, key, locale, version, title, audience, status, text_hash]
      properties:
        id: { type: string, format: uuid }
        key: { $ref: '#/components/schemas/LegalKey' }
        locale: { type: string, enum: [uz, ru] }
        version: { type: string }
        title: { type: string }
        audience: { type: string, enum: [customer, shop, courier] }
        status: { type: string, enum: [draft, effective, retired] }
        effective_from: { type: [string, 'null'], format: date-time }
        text_hash: { type: string }
        placeholders: { type: array, items: { type: string }, description: "To'ldirilmagan joylar (draft yaratilganda)" }
    LegalDraftInput:
      type: object
      required: [key, locale, title, body_md]
      additionalProperties: false
      properties:
        key: { $ref: '#/components/schemas/LegalKey' }
        locale: { type: string, enum: [uz, ru] }
        title: { type: string, minLength: 3, maxLength: 200 }
        body_md: { type: string, minLength: 200 }
    LegalPublished:
      type: object
      required: [id, key, locale, version, status, effective_from, text_hash]
      properties:
        id: { type: string, format: uuid }
        key: { $ref: '#/components/schemas/LegalKey' }
        locale: { type: string }
        version: { type: string }
        status: { type: string, const: effective }
        effective_from: { type: string, format: date-time }
        text_hash: { type: string }
    PlanCode: { type: string, enum: [start, biznes, pro, tarmoq] }
    Role: { type: string, enum: [owner, manager, picker, cashier, dispatcher, accountant, marketer, courier] }
    InviteRole: { type: string, enum: [manager, picker, cashier, dispatcher, accountant, marketer, courier] }
    ConsentInput:
      type: object
      required: [document, version]
      additionalProperties: false
      properties:
        document: { type: string, enum: [customer_offer, privacy_policy, shop_saas_offer, shop_dpa] }
        version: { type: string, description: "Hujjatning joriy versiyasi (GET /v1/legal/documents)" }
    OtpRequest:
      type: object
      required: [phone]
      additionalProperties: false
      properties: { phone: { type: string, pattern: '^\+998[0-9]{9}$' } }
    OtpRequested:
      type: object
      required: [expires_in, retry_after]
      properties: { expires_in: { type: integer }, retry_after: { type: integer } }
    OtpVerify:
      type: object
      required: [phone, code]
      additionalProperties: false
      properties:
        phone: { type: string, pattern: '^\+998[0-9]{9}$' }
        code: { type: string, pattern: '^[0-9]{6}$' }
        consents: { type: array, items: { $ref: '#/components/schemas/ConsentInput' } }
        marketing_consent: { type: boolean }
    TelegramSignIn:
      type: object
      required: [init_data]
      additionalProperties: false
      properties:
        init_data: { type: string }
        consents: { type: array, items: { $ref: '#/components/schemas/ConsentInput' } }
        marketing_consent: { type: boolean }
    RefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties: { refresh_token: { type: string } }
    Tokens:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, description: Soniyalarda (900) }
    SignInResult:
      allOf:
        - { $ref: '#/components/schemas/Tokens' }
        - type: object
          required: [is_new_user, user]
          properties:
            is_new_user: { type: boolean }
            user: { $ref: '#/components/schemas/Me' }
    MfaChallenge:
      type: object
      required: [mfa_required, mfa_token]
      properties:
        mfa_required: { type: boolean, const: true }
        mfa_token: { type: string }
    TotpEnrollment:
      type: object
      required: [secret, otpauth_uri]
      properties: { secret: { type: string }, otpauth_uri: { type: string } }
    TotpCode:
      type: object
      required: [code]
      additionalProperties: false
      properties: { code: { type: string, pattern: '^[0-9]{6}$' } }
    TotpVerify:
      type: object
      required: [mfa_token, code]
      additionalProperties: false
      properties: { mfa_token: { type: string }, code: { type: string, pattern: '^[0-9]{6}$' } }
    Membership:
      type: object
      required: [member_id, tenant_id, tenant_name, tenant_slug, role, status]
      properties:
        member_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        tenant_name: { type: string }
        tenant_slug: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        status: { type: string, enum: [active, suspended] }
    Me:
      type: object
      required: [id, phone_masked, locale, totp_enabled, is_platform_admin, memberships]
      properties:
        id: { type: string, format: uuid }
        phone_masked: { type: [string, 'null'] }
        locale: { type: string, enum: [uz, ru] }
        telegram_linked: { type: boolean }
        totp_enabled: { type: boolean }
        is_platform_admin: { type: boolean }
        memberships: { type: array, items: { $ref: '#/components/schemas/Membership' } }
    TenantCreate:
      type: object
      required: [name, tin]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        tin: { type: string, description: STIR — aynan 9 ta raqam }
        consents: { type: array, maxItems: 4, items: { $ref: '#/components/schemas/ConsentInput' }, description: "SaaS oferta va DPA akcepti (shop_saas_offer, shop_dpa); bo'lmasa 422 consent.required" }
    TenantUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        tin: { type: string }
        status: { type: string, enum: [active] }
    Tenant:
      type: object
      required: [id, name, slug, tin, status, plan, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string, description: "Vitrina havolasi: /d/<slug>" }
        tin: { type: string }
        status: { type: string, enum: [draft, active, suspended] }
        plan:
          type: object
