        '200': { description: Topshiriqlar va kuryerdagi naqd, content: { application/json: { schema: { type: object, required: [items, cash_on_hand_tiyin, cash_limit_tiyin], properties: { cash_on_hand_tiyin: { type: integer }, cash_limit_tiyin: { type: integer }, items: { type: array, items: { $ref: '#/components/schemas/CourierDelivery' } } } } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/courier/deliveries/{id}/pickup:
    post:
      tags: [fulfillment]
      operationId: courierPickup
      parameters: [{ $ref: '#/components/parameters/TenantId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: "Buyurtma olindi (delivering)", content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/courier/deliveries/{id}/deliver:
    post:
      tags: [fulfillment]
      operationId: courierDeliver
      summary: "Yetkazildi: buyurtma completed, qoldiq ayriladi, naqd yig'ilgani yoziladi"
      parameters: [{ $ref: '#/components/parameters/TenantId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Yetkazildi, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/courier/deliveries/{id}/fail:
    post:
      tags: [fulfillment]
      operationId: courierFail
      parameters: [{ $ref: '#/components/parameters/TenantId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], additionalProperties: false, properties: { reason: { type: string, minLength: 2, maxLength: 200 } } } } } }
      responses:
        '200': { description: "Muvaffaqiyatsiz (failed), band bo'shaydi", content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/courier/location:
    post:
      tags: [fulfillment]
      operationId: courierLocation
      summary: GPS nuqtasi (har 15 soniyada)
      parameters: [{ $ref: '#/components/parameters/TenantId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [lat, lng], additionalProperties: false, properties: { lat: { type: number, minimum: -90, maximum: 90 }, lng: { type: number, minimum: -180, maximum: 180 }, accuracy_m: { type: integer, minimum: 0 } } } } } }
      responses:
        '200': { description: Saqlandi, content: { application/json: { schema: { type: object, required: [ok], properties: { ok: { type: boolean } } } } } }
